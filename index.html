<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Секс</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            padding: 1.5rem;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #000;
            border: 1px solid #fff;
            border-radius: 6px;
            padding: 3rem 2rem;
            text-align: center;
        }

        h1 {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: #fff;
            line-height: 1.4;
            margin-bottom: 1.5rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: #000;
            color: #fff;
            text-decoration: none;
            border: 1px solid #fff;
            border-radius: 6px;
            font-weight: 600;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            transition: all 0.2s ease;
            word-break: break-all;
            max-width: 100%;
        }

        a:hover {
            background: #fff;
            color: #000;
        }

        a:active {
            transform: translateY(0);
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
            }

            h1 {
                font-size: 1.3rem;
            }

            a {
                padding: 0.6rem 1.2rem;
                font-size: 0.95rem;
            }
        }

        @media (min-width: 1200px) {
            .container {
                padding: 4rem 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Привет всем посетителям этого сайта! Загляните на fourcec5.github.io/howtoskidrblxscripts.html</h1>
        <a href="https://fourcec5.github.io/howtoskidrblxscripts.html" target="_blank">Перейти на сайт</a>
    </div>
</body>
</html>
